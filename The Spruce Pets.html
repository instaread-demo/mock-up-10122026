  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

e=\"{{ isPlaying }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"display:flex; gap:4px;\">\n                      <div style=\"width:5px; height:17px; background:#fff; border-radius:2px;\"><\u002Fdiv>\n                      <div style=\"width:5px; height:17px; background:#fff; border-radius:2px;\"><\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ isNotPlaying }}\" hint-placeholder-val=\"{{ true }}\">\n                    <div style=\"width:0; height:0; border-top:9px solid transparent; border-bottom:9px solid transparent; border-left:15px solid #fff; margin-left:4px;\"><\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n                <div style=\"flex:1; display:flex; flex-direction:column; min-width:0;\">\n                  <div data-wave=\"1\" sc-camel-on-click=\"{{ seek }}\" style=\"display:flex; align-items:center; gap:2px; height:34px; cursor:pointer; overflow:hidden;\">\n                    <sc-for list=\"{{ bars }}\" as=\"bar\" hint-placeholder-count=\"80\">\n                      <div style=\"width:3px; flex:0 0 3px; border-radius:2px; height: {{ bar.h }}; background: {{ bar.color }}; animation: {{ bar.anim }}; transform-origin:center;\"><\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                  <div style=\"display:flex; justify-content:flex-end; align-items:center; gap:5px; margin-top:3px;\">\n                    <img src=\"d0ece14c-cec7-4357-acb2-d4d78b207a06\" alt=\"Instaread\" style=\"height:13px; width:auto;\">\n                    <span style=\"font-size:12px; color:#8a8a8a;\">Instaread<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"flex:0 0 200px; display:flex; flex-direction:column;\">\n              <div style=\"font-weight:600; font-size:11px; color:#a8a8a8; margin-bottom:5px;\">Sponsored by<\u002Fdiv>\n              <img src=\"04a37329-9962-4437-8db7-66111b1d55d0\" alt=\"Netflix\" style=\"width:100%; border-radius:5px; display:block;\">\n            <\u002Fdiv>\n          <\u002Fdiv>\n      <article style=\"font-family:'Libre Baskerville',Georgia,serif; font-size:14px; line-height:1.6; color:#222; display:flex; flex-direction:column; gap:18px;\">\n        <p style=\"margin:0;\">Bringing home your first dog can stir up a cocktail of emotions—excitement at the thought of a wagging tail greeting you every day, but also a flicker of uncertainty about how this new family member will slot into your life.<\u002Fp>\n        <div style=\"height:120px; display:flex; justify-content:center; align-items:center;\"><span style=\"font-family:'Nunito Sans',Helvetica,Arial,sans-serif; font-size:8px; color:#999; writing-mode:vertical-rl;\">Advertisement<\u002Fspan><\u002Fdiv>\n        <p style=\"margin:0;\">Taking time to prepare can ease those early nerves and smooth the transition for both of you. Get ready to welcome your first dog by gathering essential supplies, setting up a comfortable and safe space, assembling a support team, and learning about pet behavior and needs.<\u002Fp>\n        <p style=\"margin:0;\">\"Like all big commitments, adopting a dog is best done with thoughtful consideration and careful preparation,\" says Amanda Farah, CPDT-KA, national training and behavior coordinator for <a href=\"#\" style=\"color:#2a7f9e; text-decoration:underline;\">Best Friends Animal Society<\u002Fa>. \"It's much less stressful for everyone, most importantly the dog, when they arrive home to a space that's been prepped to meet their needs and a family who knows what to expect those first few weeks.\"<\u002Fp>\n        <h2 style=\"font-weight:400; font-size:26px; color:#111; margin:22px 0 0;\">Before You Commit<\u002Fh2>\n        <p style=\"margin:0;\">Preparation begins long before you bring your canine companion home. Before committing, make sure everyone in your household is on board—roommates, spouses, kids and anyone else under your roof. If you rent, that also means double-checking your lease and talking to your landlord.<\u002Fp>\n        <p style=\"margin:0;\">Next, think about your lifestyle. Are you after an active adventure buddy for the <a href=\"#\" style=\"color:#2a7f9e; text-decoration:underline;\">hiking trails<\u002Fa>, or more of a <a href=\"#\" style=\"color:#2a7f9e; text-decoration:underline;\">mellow couch potato<\u002Fa> to snuggle up with during movies? Does your home have a fenced yard, or will you be trudging up and down stairs every day for leashed potty breaks? Does your schedule allow for <a href=\"#\" style=\"color:#2a7f9e; text-decoration:underline;\">walks<\u002Fa>, training and <a href=\"#\" style=\"color:#2a7f9e; text-decoration:underline;\">dog park<\u002Fa> visits?<\u002Fp>\n        <p style=\"margin:0;\">\"We stress the importance of doing your research and honestly evaluating your lifestyle before adopting,\" says Laurie Hood, founder of <a href=\"#\" style=\"color:#2a7f9e; text-decoration:underline;\">Alaqua Animal Refuge<\u002Fa> in Freeport, Florida. \"It's easy to see a cute puppy or beautiful dog and fall in love. But impulsive decisions can result in frustration for both the dog and the family. You'll be able to create natural support for your new pet by finding a pet that fits in your personality and lifestyle.\"<\u002Fp>\n        <p style=\"margin:0;\">With all this in mind, look for the right breed or <a href=\"#\" style=\"color:#2a7f9e; text-decoration:underline;\">mixed-breed dog<\u002Fa> for your situation. If you're adopting from a shelter or rescue, share this information with the team so they can pair you with the perfect pup.<\u002Fp>\n        <p style=\"margin:0;\">\"[We] work very intentionally to match families and dogs,\" says Hood. \"We spend time getting to know each dog in our care, but we also take the time to understand potential adopters. When the right match is made, it sets the family and the dog up for long-term success. Adoption should feel joyful, but it should also feel thoughtful.\"<\u002Fp>\n        <h2 style=\"font-weight:400; font-size:26px; color:#111; margin:22px 0 0;\">Essential Supplies Checklist<\u002Fh2>\n        <p style=\"margin:0;\">It doesn't take much to make a dog happy, but these easy-to-please pets do need a few essentials. Before adopting, set up a safe and comfortable space for your dog, assemble everything you'll need for exercise and training, and stock up on grooming supplies. Here's a good list of <a href=\"#\" style=\"color:#2a7f9e; text-decoration:underline;\">essential dog supplies<\u002Fa> to start with:<\u002Fp>\n        <ul style=\"margin:0; padding-left:18px; color:#222;\">\n          <li style=\"margin:0 0 6px;\"><a href=\"#\" style=\"color:#2a7f9e; text-decoration:underline;\">Crate<\u002Fa><\u002Fli><li style=\"margin:0 0 6px;\"><a href=\"#\" style=\"color:#2a7f9e; text-decoration:underline;\">Dog bed<\u002Fa><\u002Fli><li style=\"margin:0 0 6px;\">Food and water bowls<\u002Fli><li style=\"margin:0 0 6px;\">Crash-tested <a href=\"#\" style=\"color:#2a7f9e; text-decoration:underline;\">car restraint system<\u002Fa> for dogs (Farah recommends for dogs who will ride in cars frequently)<\u002Fli><li style=\"margin:0 0 6px;\"><a href=\"#\" style=\"color:#2a7f9e; text-decoration:underline;\">Leash<\u002Fa><\u002Fli><li style=\"margin:0 0 6px;\">Collar with <a href=\"#\" style=\"color:#2a7f9e; text-decoration:underline;\">ID tags<\u002Fa><\u002Fli><li style=\"margin:0 0 6px;\">Harness<\u002Fli><li style=\"margin:0 0 6px;\">Clicker<\u002Fli><li style=\"margin:0 0 6px;\"><a href=\"#\" style=\"color:#2a7f9e; text-decoration:underline;\">Treat pouch<\u002Fa><\u002Fli><li style=\"margin:0 0 6px;\">Age- and size-appropriate toys<\u002Fli><li style=\"margin:0 0 6px;\"><a href=\"#\" style=\"color:#2a7f9e; text-decoration:underline;\">Enrichment tools<\u002Fa> like puzzles and games<\u002Fli><li style=\"margin:0 0 6px;\">Dog <a href=\"#\" style=\"color:#2a7f9e; text-decoration:underline;\">toothpaste<\u002Fa> and toothbrush<\u002Fli><li style=\"margin:0 0 6px;\">Dental chews<\u002Fli><li style=\"margin:0 0 6px;\"><a href=\"#\" style=\"color:#2a7f9e; text-decoration:underline;\">Nail clippers<\u002Fa> or grinders<\u002Fli><li style=\"margin:0 0 6px;\"><a href=\"#\" style=\"color:#2a7f9e; text-decoration:underline;\">Ear cleaning solution<\u002Fa><\u002Fli><li style=\"margin:0 0 6px;\">Small <a href=\"#\" style=\"color:#2a7f9e; text-decoration:underline;\">first aid kit<\u002Fa><\u002Fli>\n        <\u002Ful>\n      <\u002Farticle>\n    <\u002Fdiv>\n  <\u002Fmain>\n\n  <footer style=\"background:#111; padding:36px 16px; display:flex; flex-direction:column; align-items:center; gap:14px;\">\n    <span style=\"font-family:'Libre Baskerville',Georgia,serif; font-weight:400; font-size:30px; line-height:1; color:#fff;\"><span style=\"font-size:16px; font-style:italic;\">the<\u002Fspan> spruce<span style=\"font-family:'Nunito Sans',Helvetica,Arial,sans-serif; color:#f0806a; font-weight:700;\">PETS<\u002Fspan><\u002Fspan>\n    <div style=\"color:#bdbdbd; font-size:13px; text-align:center;\">© 2026 Instaread Demo Factory — Original layout built for demonstration purposes only.<\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;playButtonColor&quot;: {&quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#f0806a&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;options&quot;: [&quot;#f0806a&quot;, &quot;#111111&quot;, &quot;#333333&quot;, &quot;#8a8a8a&quot;], &quot;section&quot;: &quot;Player&quot;},\n  &quot;audioSrc&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;uploads/sprucepets-audio.mp3&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Player&quot;},\n  &quot;showDisclaimer&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Demo&quot;}\n}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    const heights = [];\n    let s = 7;\n    for (let i = 0; i < 220; i++) { s = (s * 16807) % 2147483647; heights.push(6 + (s % 30)); }\n    this.heights = heights;\n    this.state = { isPlaying: false, progress: 0, floatVisible: false, floatClosed: false };\n    this.audioRef = null; this.playerEl = null; this.simTimer = null;\n  }\n  componentDidMount() {\n    const padFit = () => {\n      const bar = document.querySelector('[data-demo-bar]');\n      const page = document.querySelector('[data-page-root]');\n      if (bar && page) page.style.paddingTop = Math.max(40, bar.offsetHeight) + 'px';\n    };\n    padFit();\n    window.addEventListener('resize', padFit);\n    this.padFit = padFit;\n    const fitGrid = () => {\n      const w = window.innerWidth;\n      document.querySelectorAll('[data-cols]').forEach((g) => { g.style.gridTemplateColumns = w < 900 ? 'minmax(0,1fr)' : g.getAttribute('data-cols'); });\n      document.querySelectorAll('[data-hide-mobile]').forEach((el) => { el.style.display = w < 900 ? 'none' : ''; });\n    };\n    fitGrid();\n    window.addEventListener('resize', fitGrid);\n    this.fitGrid = fitGrid;\n    // Fixed 2px strokes + 2px gaps: compute how many fit the waveform track so it fills to the edge without stretching\n    const fitBars = () => {\n      const track = this.playerEl && this.playerEl.querySelector('[data-wave]');\n      if (!track) return;\n      const count = Math.max(20, Math.min(this.heights.length, Math.floor((track.clientWidth + 2) / 5)));\n      if (count !== this.state.barCount) this.setState({ barCount: count });\n    };\n    this.fitBars = fitBars;\n    setTimeout(fitBars, 0);\n    window.addEventListener('resize', fitBars);\n    const base = this.props.audioSrc ?? \"uploads/sprucepets-audio.mp3\";\n    const tryLoad = async () => {\n      if (window.__resources && window.__resources.articleAudio) return window.__resources.articleAudio;\n      try {\n        const url = base.split('/').map(encodeURIComponent).join('/');\n        const res = await fetch(url);\n        if (!res.ok) return null;\n        const blob = await res.blob();\n        return URL.createObjectURL(blob);\n      } catch (e) { return null; }\n    };\n    tryLoad().then((url) => {\n      if (!url) return;\n      const a = new Audio(url);\n      a.addEventListener('timeupdate', () => { if (a.duration) this.setState({ progress: a.currentTime / a.duration }); });\n      a.addEventListener('ended', () => this.setState({ isPlaying: false, progress: 0 }));\n      a.addEventListener('loadedmetadata', () => this.forceUpdate());\n      this.audioRef = a;\n      if (this.state.isPlaying && this.simTimer) {\n        this.stopSim();\n        a.currentTime = this.state.progress * (a.duration || 0);\n        a.play().catch(() => this.startSim());\n      }\n    });\n    this.onScroll = () => {\n      const el = this.playerEl;\n      if (!el) return;\n      const vis = el.getBoundingClientRect().bottom < 0;\n      if (vis !== this.state.floatVisible) this.setState({ floatVisible: vis });\n    };\n    window.addEventListener('scroll', this.onScroll, { passive: true });\n  }\n  componentWillUnmount() {\n    this.stopSim();\n    if (this.audioRef) this.audioRef.pause();\n    if (this.onScroll) window.removeEventListener('scroll', this.onScroll);\n    if (this.padFit) window.removeEventListener('resize', this.padFit);\n    if (this.fitGrid) window.removeEventListener('resize', this.fitGrid);\n    if (this.fitBars) window.removeEventListener('resize', this.fitBars);\n  }\n  startSim() {\n    if (this.simTimer) return;\n    this.simTimer = setInterval(() => {\n      const p = this.state.progress + 0.25 / 90;\n      if (p >= 1) { this.stopSim(); this.setState({ isPlaying: false, progress: 0 }); }\n      else this.setState({ progress: p });\n    }, 250);\n  }\n  stopSim() { if (this.simTimer) { clearInterval(this.simTimer); this.simTimer = null; } }\n  getDuration() {\n    const a = this.audioRef;\n    return (a && a.duration && isFinite(a.duration)) ? a.duration : 90;\n  }\n  skipBy(sec) {\n    const a = this.audioRef;\n    if (a && a.duration && isFinite(a.duration)) a.currentTime = Math.min(a.duration, Math.max(0, a.currentTime + sec));\n    else this.setState({ progress: Math.min(1, Math.max(0, this.state.progress + sec / this.getDuration())) });\n  }\n  renderVals() {\n    const playColor = this.props.playButtonColor ?? '#f0806a';\n    const { isPlaying, progress } = this.state;\n    const n = this.state.barCount || this.heights.length;\n    const played = Math.floor(progress * n);\n    const bars = this.heights.slice(0, n).map((h, i) => ({\n      h: h + 'px',\n      color: i < played ? playColor : '#c9ccd1',\n      anim: isPlaying ? ('ir-pulse 0.9s ease-in-out ' + ((i % 12) * 0.075).toFixed(3) + 's infinite') : 'none'\n    }));\n    const dur = this.getDuration();\n    const fmt = (t) => Math.floor(t / 60) + ':' + String(Math.floor(t % 60)).padStart(2, '0');\n    const floatShow = this.state.floatVisible && !this.state.floatClosed;\n    return {\n      playColor, bars, isPlaying, isNotPlaying: !isPlaying,\n      showDisclaimer: this.props.showDisclaimer ?? true,\n      floatShow,\n      badgeBottom: floatShow ? '84px' : '12px',\n      progressPct: (progress * 100).toFixed(2) + '%',\n      timeLabel: fmt(progress * dur) + ' / ' + fmt(dur),\n      togglePlay: () => {\n        const a = this.audioRef;\n        if (this.state.isPlaying) { if (a) a.pause(); this.stopSim(); this.setState({ isPlaying: false }); }\n        else if (a) {\n          const p = a.play();\n          if (p) p.then(() => this.setState({ isPlaying: true })).catch(() => { this.startSim(); this.setState({ isPlaying: true }); });\n          else this.setState({ isPlaying: true });\n        } else { this.startSim(); this.setState({ isPlaying: true }); }\n      },\n      seek: (e) => {\n        const r = e.currentTarget.getBoundingClientRect();\n        const frac = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));\n        const a = this.audioRef;\n        if (a && a.duration && isFinite(a.duration)) a.currentTime = frac * a.duration;\n        else this.setState({ progress: frac });\n      },\n      skipBack: () => this.skipBy(-15),\n      skipFwd: () => this.skipBy(15),\n      closeFloat: () => this.setState({ floatClosed: true }),\n      setPlayerRef: (el) => { this.playerEl = el; if (el && this.fitBars) setTimeout(this.fitBars, 0); }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
